[package]
name = "sparkle"
version = "0.1.0"
edition = "2024"

[lib]
name = "sparkle"
path = "src/lib.rs"

[dependencies]
file-format = "0.28.0"
clap = { version = "4.5.41", features = ["derive"] }
mime_guess2 = "2.3.1"
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }
infer = "0.19.0"
zip = "4.5.0"
content_inspector = "0.2.4"
tree_magic_mini = "3.2.0"
comfy-table = "7.2.0"

[dev-dependencies]
tempfile = "3.8"
